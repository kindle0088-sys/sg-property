<line x1="500" y1="220" x2="500" y2="236" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="500" y1="292" x2="500" y2="308" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="40" y="480" width="600" height="112" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="502" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">共用聚合文件 · 冲突风险源</text>
<text x="340" y="524" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">market-summary / property-index / hdb-index（双流水线同写）</text>
<text x="340" y="548" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#633806">对策：先对齐远程再构建 — fetch → merge --ff-only，分叉则 reset --mixed</text>
<text x="340" y="570" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">失败处理：logs/build-error.log + 自动开 GitHub issue</text>
<line x1="180" y1="436" x2="180" y2="476" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<line x1="500" y1="364" x2="500" y2="476" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
