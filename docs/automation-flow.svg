<text x="500" y="205" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">_id 锚点 · 缓存复用</text>
<rect x="360" y="240" width="280" height="52" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
