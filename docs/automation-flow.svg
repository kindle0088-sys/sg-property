<text x="500" y="277" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">build.js --skip-ura</text>
<rect x="360" y="312" width="280" height="52" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="500" y="331" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">提交推送</text>
<text x="500" y="349" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">commit → push origin main</text>
</g>
