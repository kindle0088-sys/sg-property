<text x="500" y="133" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">cron '0 20 * * *' = 04:00 SGT</text>
<rect x="360" y="168" width="280" height="52" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
