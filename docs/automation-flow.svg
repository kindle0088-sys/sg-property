<text x="500" y="54" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">hdb-refresh.yml · HDB 增量</text>
<g>
<rect x="40" y="96" width="280" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
