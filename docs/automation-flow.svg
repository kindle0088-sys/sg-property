<text x="180" y="259" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">URA 构建</text>
<text x="180" y="277" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">build.js --skip-hdb</text>
<rect x="40" y="312" width="280" height="52" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="180" y="331" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">提交推送</text>
<text x="180" y="349" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">commit → push origin main</text>
<rect x="40" y="384" width="280" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="180" y="403" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">收尾监控</text>
<text x="180" y="421" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">显式 gc · loose 数量告警</text>
</g>
<g>
<rect x="360" y="96" width="280" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
