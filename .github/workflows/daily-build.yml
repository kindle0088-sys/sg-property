name: Daily Data Build

on:
  schedule:
    # Daily 02:00 UTC = 10:00 Singapore time
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Compute cache key
        run: echo "DAY_KEY=$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Cache HDB raw data (255MB, rolling daily)
        uses: actions/cache@v4
        with:
          path: data/hdb_cache
          key: hdb-cache-${{ env.DAY_KEY }}
          restore-keys: |
            hdb-cache-

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Run build (Sunday = full --fresh refresh)
        working-directory: scripts
        env:
          URA_ACCESS_KEY: ${{ secrets.URA_ACCESS_KEY }}
        run: |
          if [ "$(date +%u)" = "7" ]; then
            echo "Sunday: full refresh"
            node build.js --fresh
          else
            echo "Weekday: incremental (cached HDB)"
            node build.js
          fi

      - name: Commit and push data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ .github/
          if git diff --cached --quiet; then
            echo "No data changes; skipping commit"
          else
            git commit -m "chore: daily data build $(date -u +%Y-%m-%d)"
            git push origin main
          fi
