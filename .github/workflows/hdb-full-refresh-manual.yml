name: HDB Full Refresh (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hdb-full
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Compute cache key
        run: echo "DAY_KEY=$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Cache HDB raw data (255MB, rolling)
        uses: actions/cache@v6
        with:
          path: data/hdb_cache
          key: hdb-cache-${{ env.DAY_KEY }}
          restore-keys: |
            hdb-cache-

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Run unit tests
        working-directory: scripts
        run: npm test

      - name: Run full refresh (--fresh pulls all HDB datasets, --skip-ura reuses committed URA)
        working-directory: scripts
        run: node build.js --fresh --skip-ura

      - name: Commit and push data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ .github/
          if git diff --cached --quiet; then
            echo "No data changes; skipping commit"
          else
            # Same REAL rules as hdb-refresh.yml (core files or real
            # market-summary change beyond buildTime).
            REAL=$(git diff --cached --name-only | grep -E 'data/(hdb|hdb-index|hdb-towns)' || true)
            if git diff --cached --name-only | grep -q '^data/market-summary\.json$'; then
              if ! git show HEAD:data/market-summary.json 2>/dev/null | jq -S 'del(.buildTime)' | diff -q - <(jq -S 'del(.buildTime)' data/market-summary.json) >/dev/null 2>&1; then
                REAL="${REAL} data/market-summary.json"
              fi
            fi
            if [ -z "$REAL" ]; then
              echo "Only timestamp/aggregate changes; skipping commit"
              git reset -q
            else
              git commit -m "chore: HDB full refresh $(date -u +%Y-%m-%d)"
              git push origin main
            fi
          fi
