name: HDB Daily Increment

on:
  schedule:
    # Daily 20:00 UTC = 04:00 Singapore time
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hdb-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Compute cache key
        run: echo "DAY_KEY=$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Restore HDB raw data cache (255MB, rolling)
        uses: actions/cache/restore@v6
        with:
          path: data/hdb_cache
          key: hdb-cache-${{ env.DAY_KEY }}
          restore-keys: |
            hdb-cache-

      # Baseline checksum: only save a new 255MB cache entry when the build
      # actually pulled new HDB data into data/hdb_cache (otherwise the
      # 10GB cache quota would fill with identical daily copies).
      - name: Baseline HDB cache checksum
        run: find data/hdb_cache -type f 2>/dev/null | sort | xargs sha256sum 2>/dev/null | sha256sum > /tmp/hdb-cache-baseline.txt

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Run unit tests
        working-directory: scripts
        run: npm test

      - name: Run incremental build (active dataset only, ~seconds)
        working-directory: scripts
        run: node build.js --skip-ura

      - name: Detect new HDB data
        id: cachecheck
        run: |
          NEW=$(find data/hdb_cache -type f 2>/dev/null | sort | xargs sha256sum 2>/dev/null | sha256sum | awk '{print $1}')
          OLD=$(awk '{print $1}' /tmp/hdb-cache-baseline.txt 2>/dev/null)
          if [ -n "$NEW" ] && [ "$NEW" != "$OLD" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new HDB data pulled; skipping cache save"
          fi

      - name: Save HDB cache
        if: steps.cachecheck.outputs.changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: data/hdb_cache
          key: hdb-cache-${{ env.DAY_KEY }}

      - name: Commit and push data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ .github/
          if git diff --cached --quiet; then
            echo "No data changes; skipping commit"
          else
            # Commit only when real data changed (not buildTime-only churn):
            # 1) core HDB/index files, or
            # 2) market-summary changed beyond its buildTime timestamp
            #    (i.e. URA/HDB aggregate numbers actually moved).
            REAL=$(git diff --cached --name-only | grep -E 'data/(hdb|hdb-index|hdb-towns)' || true)
            if git diff --cached --name-only | grep -q '^data/market-summary\.json$'; then
              if ! git show HEAD:data/market-summary.json 2>/dev/null | jq -S 'del(.buildTime)' | diff -q - <(jq -S 'del(.buildTime)' data/market-summary.json) >/dev/null 2>&1; then
                REAL="${REAL} data/market-summary.json"
              fi
            fi
            if [ -z "$REAL" ]; then
              echo "Only timestamp/aggregate changes; skipping commit"
              git reset -q
            else
              git commit -m "chore: HDB incremental update $(date -u +%Y-%m-%d)"
              git push origin main
            fi
          fi
