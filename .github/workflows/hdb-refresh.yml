name: HDB Daily Increment

on:
  schedule:
    # Daily 20:00 UTC = 04:00 Singapore time
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hdb-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Compute cache key
        run: echo "DAY_KEY=$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Cache HDB raw data (255MB, rolling daily)
        uses: actions/cache@v6
        with:
          path: data/hdb_cache
          key: hdb-cache-${{ env.DAY_KEY }}
          restore-keys: |
            hdb-cache-

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Run incremental build (active dataset only, ~seconds)
        working-directory: scripts
        run: node build.js --skip-ura

      - name: Commit and push data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ .github/
          if git diff --cached --quiet; then
            echo "No data changes; skipping commit"
          else
            # Commit only when real HDB data files changed (not buildTime-only
            # churn in market-summary/build-meta aggregates).
            REAL=$(git diff --cached --name-only | grep -E 'data/(hdb|hdb-index|hdb-towns|property-index)' || true)
            if [ -z "$REAL" ]; then
              echo "Only timestamp/aggregate changes; skipping commit"
              git reset -q
            else
              git commit -m "chore: HDB incremental update $(date -u +%Y-%m-%d)"
              git push origin main
            fi
          fi
